name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "24.04", "26.04"]
    env:
      DEBIAN_FRONTEND: noninteractive
      DEPS_WS: /opt/deps
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git ca-certificates python3 python3-pip python3-venv \
            libeigen3-dev libboost-all-dev libgtest-dev \
            liburdfdom-dev liburdfdom-headers-dev

      - name: Install recent CMake and vcstool
        run: |
          python3 -m venv /tmp/tool-venv
          /tmp/tool-venv/bin/pip install --no-cache-dir --upgrade cmake vcstool
          echo "/tmp/tool-venv/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Fetch source dependencies
        run: |
          mkdir -p "$DEPS_WS"
          vcs import "$DEPS_WS" < .repos
          git -C "$DEPS_WS/pinocchio" submodule update --init --recursive

      - name: Build and install pinocchio
        run: |
          cmake -S "$DEPS_WS/pinocchio" -B "$DEPS_WS/build/pinocchio" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TESTING=OFF -DBUILD_PYTHON_INTERFACE=OFF \
            -DBUILD_WITH_COLLISION_SUPPORT=OFF -DBUILD_BENCHMARK=OFF
          cmake --build "$DEPS_WS/build/pinocchio" -j"$(nproc)"
          cmake --install "$DEPS_WS/build/pinocchio"

      - name: Build thor_math
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          cmake -S thor_math -B build/thor_math \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DBUILD_UNIT_TESTS=ON -DBUILD_INTEGRATION_TESTS=ON
          cmake --build build/thor_math -j"$(nproc)"

      - name: Test thor_math
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          ctest --test-dir build/thor_math --output-on-failure

  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      DEBIAN_FRONTEND: noninteractive
      DEPS_WS: /opt/deps
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ca-certificates python3 python3-pip python3-venv lcov \
            libeigen3-dev libboost-all-dev libgtest-dev \
            liburdfdom-dev liburdfdom-headers-dev

      - name: Install recent CMake and vcstool
        run: |
          python3 -m venv /tmp/tool-venv
          /tmp/tool-venv/bin/pip install --no-cache-dir --upgrade cmake vcstool
          echo "/tmp/tool-venv/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Fetch source dependencies
        run: |
          sudo mkdir -p "$DEPS_WS"
          sudo chown "$USER:$USER" "$DEPS_WS"
          vcs import "$DEPS_WS" < .repos
          git -C "$DEPS_WS/pinocchio" submodule update --init --recursive

      - name: Build and install pinocchio
        run: |
          cmake -S "$DEPS_WS/pinocchio" -B "$DEPS_WS/build/pinocchio" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TESTING=OFF -DBUILD_PYTHON_INTERFACE=OFF \
            -DBUILD_WITH_COLLISION_SUPPORT=OFF -DBUILD_BENCHMARK=OFF
          cmake --build "$DEPS_WS/build/pinocchio" -j"$(nproc)"
          sudo cmake --install "$DEPS_WS/build/pinocchio"

      - name: Build and test with coverage
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          cmake -S thor_math -B build/coverage \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=/usr/local \
            -DBUILD_UNIT_TESTS=ON -DBUILD_INTEGRATION_TESTS=ON \
            -DENABLE_COVERAGE=ON
          cmake --build build/coverage -j"$(nproc)"
          ctest --test-dir build/coverage --output-on-failure

      - name: Generate coverage report
        run: |
          lcov --capture --directory build/coverage --output-file coverage.info
          lcov --remove coverage.info \
            '/usr/*' '*/include/qpmad/*' \
            --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.info
          fail_ci_if_error: true
          use_oidc: true
